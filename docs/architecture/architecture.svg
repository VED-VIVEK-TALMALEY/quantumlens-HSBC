<svg width="680" height="1040" viewBox="0 0 680 1040" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<title>QuantumLens V5 system architecture</title>
<desc>Diagram showing the QuantumLens V5 stack from Next.js frontend through the FastAPI gateway, agent layer, orchestrator, AI and data services, down to storage and secrets infrastructure.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="680" height="1040" fill="#ffffff"/>

<style>
.box{stroke-width:1;rx:8;}
.gray{fill:#F1EFE8;stroke:#5F5E5A;}
.purple{fill:#EEEDFE;stroke:#534AB7;}
.teal{fill:#E1F5EE;stroke:#0F6E56;}
.th{font-size:14px;font-weight:600;text-anchor:middle;}
.ts{font-size:12px;font-weight:400;text-anchor:middle;}
.th.gray-t{fill:#2C2C2A;} .ts.gray-t{fill:#5F5E5A;}
.th.purple-t{fill:#26215C;} .ts.purple-t{fill:#534AB7;}
.th.teal-t{fill:#04342C;} .ts.teal-t{fill:#0F6E56;}
.arr{stroke:#5f5e5a;stroke-width:1;fill:none;}
</style>

<!-- T1 Frontend -->
<rect class="box gray" x="220" y="40" width="240" height="56" rx="8"/>
<text class="th gray-t" x="340" y="62">Next.js frontend</text>
<text class="ts gray-t" x="340" y="82">Vercel</text>

<line x1="340" y1="96" x2="340" y2="146" class="arr" marker-end="url(#arrow)"/>

<!-- T2 API Gateway -->
<rect class="box gray" x="220" y="146" width="240" height="56" rx="8"/>
<text class="th gray-t" x="340" y="168">API gateway</text>
<text class="ts gray-t" x="340" y="188">FastAPI · Google Cloud Run</text>

<path d="M340 202 L340 227 L140 227 L140 252" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="202" x2="340" y2="252" class="arr" marker-end="url(#arrow)"/>
<path d="M340 202 L340 227 L540 227 L540 252" class="arr" marker-end="url(#arrow)"/>

<!-- T3 Planner / SQL / Retrieval agents -->
<rect class="box purple" x="50" y="252" width="180" height="44" rx="8"/><text class="th purple-t" x="140" y="278">Planner agent</text>
<rect class="box purple" x="250" y="252" width="180" height="44" rx="8"/><text class="th purple-t" x="340" y="278">SQL agent</text>
<rect class="box purple" x="450" y="252" width="180" height="44" rx="8"/><text class="th purple-t" x="540" y="278">Retrieval agent</text>

<line x1="140" y1="296" x2="140" y2="346" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="296" x2="340" y2="346" class="arr" marker-end="url(#arrow)"/>
<line x1="540" y1="296" x2="540" y2="346" class="arr" marker-end="url(#arrow)"/>

<!-- T4 Chart / Explanation / Analytics agents -->
<rect class="box purple" x="50" y="346" width="180" height="44" rx="8"/><text class="th purple-t" x="140" y="372">Chart agent</text>
<rect class="box purple" x="250" y="346" width="180" height="44" rx="8"/><text class="th purple-t" x="340" y="372">Explanation agent</text>
<rect class="box purple" x="450" y="346" width="180" height="44" rx="8"/><text class="th purple-t" x="540" y="372">Analytics agent</text>

<line x1="340" y1="390" x2="340" y2="440" class="arr" marker-end="url(#arrow)"/>

<!-- T5 Agent Orchestrator -->
<rect class="box purple" x="220" y="440" width="240" height="44" rx="8"/><text class="th purple-t" x="340" y="466">Agent orchestrator</text>

<path d="M340 484 L340 509 L140 509 L140 534" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="484" x2="340" y2="534" class="arr" marker-end="url(#arrow)"/>
<path d="M340 484 L340 509 L540 509 L540 534" class="arr" marker-end="url(#arrow)"/>

<!-- T6 Groq LLM / Embedding Service / Cache Layer -->
<rect class="box teal" x="50" y="534" width="180" height="44" rx="8"/><text class="th teal-t" x="140" y="560">Groq LLM</text>
<rect class="box teal" x="250" y="534" width="180" height="44" rx="8"/><text class="th teal-t" x="340" y="560">Embedding service</text>
<rect class="box teal" x="450" y="534" width="180" height="44" rx="8"/><text class="th teal-t" x="540" y="560">Cache layer</text>

<line x1="340" y1="578" x2="340" y2="628" class="arr" marker-end="url(#arrow)"/>
<line x1="540" y1="578" x2="540" y2="628" class="arr" marker-end="url(#arrow)"/>

<!-- T7 Google Cloud Run / Redis (future) -->
<rect class="box gray" x="250" y="628" width="180" height="44" rx="8"/><text class="th gray-t" x="340" y="654">Google Cloud Run</text>
<rect class="box teal" x="450" y="628" width="180" height="56" rx="8"/>
<text class="th teal-t" x="540" y="650">Redis</text>
<text class="ts teal-t" x="540" y="670">future</text>

<line x1="340" y1="672" x2="340" y2="734" class="arr" marker-end="url(#arrow)"/>

<!-- T8 ChromaDB -->
<rect class="box teal" x="250" y="734" width="180" height="44" rx="8"/><text class="th teal-t" x="340" y="760">ChromaDB</text>

<path d="M340 778 L340 803 L140 803 L140 828" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="778" x2="340" y2="828" class="arr" marker-end="url(#arrow)"/>
<path d="M340 778 L340 803 L540 803 L540 828" class="arr" marker-end="url(#arrow)"/>

<!-- T9 Supabase / Google Cloud Logging & Monitoring / Cloud Storage -->
<rect class="box gray" x="50" y="828" width="180" height="56" rx="8"/>
<text class="th gray-t" x="140" y="850">Supabase</text>
<text class="ts gray-t" x="140" y="870">Postgres</text>
<rect class="box gray" x="250" y="828" width="180" height="56" rx="8"/>
<text class="th gray-t" x="340" y="850">Google Cloud</text>
<text class="ts gray-t" x="340" y="870">Logging &amp; monitoring</text>
<rect class="box gray" x="450" y="828" width="180" height="56" rx="8"/>
<text class="th gray-t" x="540" y="850">Cloud storage</text>
<text class="ts gray-t" x="540" y="870">Reports &amp; files</text>

<line x1="340" y1="884" x2="340" y2="934" class="arr" marker-end="url(#arrow)"/>

<!-- T10 Google Secret Manager -->
<rect class="box gray" x="220" y="934" width="240" height="44" rx="8"/><text class="th gray-t" x="340" y="960">Google secret manager</text>

<!-- Legend -->
<rect x="120" y="1000" width="14" height="14" rx="3" fill="#3C3489"/><text class="ts" x="140" y="1010" fill="#5f5e5a" text-anchor="start">Agents</text>
<rect x="230" y="1000" width="14" height="14" rx="3" fill="#085041"/><text class="ts" x="250" y="1010" fill="#5f5e5a" text-anchor="start">AI &amp; data services</text>
<rect x="410" y="1000" width="14" height="14" rx="3" fill="#444441"/><text class="ts" x="430" y="1010" fill="#5f5e5a" text-anchor="start">Frontend, gateway &amp; infra</text>
</svg>
