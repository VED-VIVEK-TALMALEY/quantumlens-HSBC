# backend/render.yaml
services:
  - type: web
    name: quantumlens-backend
    env: python
    buildCommand: |
      # Install Poetry (the version you want – see the doc you linked)
      curl -sSL https://install.python-poetry.org | python3 -
      # Make poetry available in PATH
      export PATH="$HOME/.local/bin:$PATH"
      # Install the exact Poetry version that matches your lock file
      poetry self update $(cat .poetry-version 2>/dev/null || echo "1.8.3")
      # Install all deps inside a virtualenv
      poetry install --no-interaction --no-ansi
    startCommand: poetry run uvicorn src.main:app --host 0.0.0.0 --port 8000
