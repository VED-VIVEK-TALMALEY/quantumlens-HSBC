services:
  embedding-service:
    build:
      context: ../services/embedding-service
      dockerfile: Dockerfile
    environment:
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      EMBEDDING_DEVICE: cpu
      HF_HOME: /models
    volumes:
      - embedding-model-cache:/models
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped
    networks:
      - quantumlens-internal

  quantumlens-api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      EMBEDDING_SERVICE_URL: http://embedding-service:8001
      VECTOR_DB_PATH: /app/data/vectordb
      HOST: 0.0.0.0

      
    ports:
      - "8000:8000"
    volumes:
      - ./data/vectordb:/app/data/vectordb
      - ./data/generated:/app/data/generated
      - ./data/backups:/app/data/backups
      - ./logs:/app/logs
    depends_on:
      embedding-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - quantumlens-internal

volumes:
  embedding-model-cache:

networks:
  quantumlens-internal:
    driver: bridge
