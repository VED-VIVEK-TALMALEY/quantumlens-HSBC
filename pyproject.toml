[tool.poetry]
name = "quantumlens-api"
version = "0.1.0"
description = "FastAPI backend for QuantumLens"
authors = ["Talma <talma@example.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
# Add any other libraries you import in backend/src (e.g., openai, pydantic, python‑dotenv)

[tool.poetry.dev-dependencies]
pytest = "^8.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
